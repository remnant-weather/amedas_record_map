name: Update AMeDAS Records

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: amedas-record-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check JMA updates and refresh records
        run: |
          python updater/check_rank_updates.py --execute

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add script.js record_data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update AMeDAS records"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
